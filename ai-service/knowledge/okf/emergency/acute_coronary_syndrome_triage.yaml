id: OKF-EMERG-001
title: Emergency Triage Protocol for Acute Coronary Syndromes and Chest Pain
clinical_domain: Emergency Medicine
version: "1.2"
provenance:
  source_id: AHA-ESC-ACS-2024
  title: AHA/ACC/ESC Consensus Guidelines on Emergency Chest Pain Triage
  url: https://www.ahajournals.org/doi/10.1161/CIR.0000000000001029
  publication_date: "2024-02-20"
  version: "1.2"
  is_clinically_approved: true
