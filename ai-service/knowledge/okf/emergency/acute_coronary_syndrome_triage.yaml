  evidence_level: "Level A (Emergency Clinical Guidelines)"

sections:
  - heading: Acute Red Flag Symptoms Requiring Immediate Emergency Escalation
    content: |
      Any patient presenting with crushing retrosternal chest pain radiating to the left arm, shoulder, jaw, or epigastrium,
      associated with diaphoresis (cold sweats), acute dyspnea, nausea, or syncope, meets the criteria for suspected Acute Myocardial Infarction.
      Action: IMMEDIATE EMERGENCY ESCALATION. Direct the patient to emergency medical services (911 / 108). Do NOT delay for routine booking.
    red_flags:
      - Heavy pressure or squeezing retrosternal chest pain > 10 minutes
      - Radiation to left arm, bilateral arms, neck, or jaw
      - Profuse cold sweating (diaphoresis) with nausea or lightheadedness
      - Acute shortness of breath at rest

  - heading: Initial Pre-Hospital Clinical Guidance
    content: |
      - Keep patient seated or resting in comfortable position (semifowler position).
      - Instruct to chew Aspirin (160 to 325 mg non-enteric coated) if no known severe aspirin allergy or active major bleeding.
      - If patient has prescribed sublingual Nitroglycerin, administer 1 dose under the tongue while awaiting emergency transport.
      - Prepare for automated external defibrillator (AED) access if syncope or loss of pulse occurs.
    contraindications:
      - Do NOT administer Nitroglycerin if patient has used PDE-5 inhibitors (Sildenafil, Tadalafil) within past 24-48 hours (risk of severe refractory hypotension).

