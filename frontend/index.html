<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <meta name="description" content="HealthSync – Healthcare Appointment & Follow-up Manager" />
    <title>HealthSync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply theme before paint — prevents white flash on dark mode
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('theme-store') || '{}');
          var theme = (s.state && s.state.theme) || 'dark';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (theme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      /* Critical CSS — prevent layout shift before React mounts */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        overflow-x: hidden;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        -webkit-font-smoothing: antialiased;
      }
      body:not(.dark) {
        background: #f8fafc;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
