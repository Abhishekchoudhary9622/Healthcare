version: '3.8'

services:
  # 1. PostgreSQL with pgvector for Clinical Document Embeddings
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: healthsync-postgres-vector
    restart: always
    environment:
      POSTGRES_DB: healthsync_ai
      POSTGRES_USER: healthsync
      POSTGRES_PASSWORD: healthsync_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthsync -d healthsync_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Neo4j Knowledge Graph for Medical Entity & Relationship Traversal
  neo4j:
    image: neo4j:5.20-community
    container_name: healthsync-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/healthsync_graph_pass
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4jdata:/data

  # 3. Python FastAPI Clinical AI Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: healthsync-ai-service
    restart: always
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      ENVIRONMENT: production
      DEBUG: "false"
      AI_SERVICE_API_KEY: healthsync_ai_internal_secret_key_2026
      DATABASE_URL: postgresql://healthsync:healthsync_secure_pass@postgres-vector:5432/healthsync_ai
      USE_PGVECTOR: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: healthsync_graph_pass
    ports:
      - "8000:8000"
    depends_on:
      postgres-vector:
        condition: service_healthy
      neo4j:
        condition: service_started
    volumes:
      - ./ai-service/knowledge:/app/knowledge
      - ./ai-service/data:/app/data

  # 4. Node.js Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthsync-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: healthsync_ai_internal_secret_key_2026
      JWT_SECRET: healthsync_jwt_secret_dev_key
    ports:
      - "5000:5000"
    depends_on:
      - ai-service

volumes:
  pgdata:
  neo4jdata:
